# The README's demo gif, for gen-demo-gif.py beside this. script.txt is the
# plan; edit that, then this. demo.bash builds the made-up install and the
# stand-ins first, as root in a throwaway container. Each step is typed, run for
# real, and its output shown.

title = "tt-minecraftd"
prog  = "tt-minecraftd"
seed  = 26
font  = ["Monaspace Argon SemiBold", "JetBrains Mono", "DejaVu Sans Mono"]
end_hold  = 1.5
end_black = 3.0
home_as = "/home/{user}"

# A build that isn't a release shows its date. Pinned, so a render only
# differs when the tool's output or this file does.
[[map]]
find = ' \(\d{4}-\d{2}-\d{2}\)'
put  = ' (2026-11-19)'

[[step]]
note  = "Which build is this?"
show  = "tt-minecraftd --version"
pause = 2.0

[[step]]
note  = "The server, its players, and what the firewall turned away"
show  = "tt-minecraftd status"
clear = true
pause = 4.5

[[step]]
note  = "Unsafe settings stop a start, before anything runs"
show  = "tt-minecraftd start --dry-run"
clear = true
expect_exit = 1
pause = 5.0
